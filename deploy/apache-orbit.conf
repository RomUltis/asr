# ===========================================================================
#  Orbit — exemple de reverse proxy Apache (si votre VPS utilise Apache)
#  Modules requis : sudo a2enmod proxy proxy_http headers
#  A placer dans /etc/apache2/sites-available/orbit.conf puis :
#    sudo a2ensite orbit && sudo systemctl reload apache2
#  HTTPS : sudo certbot --apache -d orbit.mondomaine.fr
# ===========================================================================

<VirtualHost *:80>
    ServerName orbit.mondomaine.fr

    ProxyPreserveHost On
    ProxyRequests Off

    # Flux temps reel (SSE) : pas de mise en tampon, delai long
    <Location /api/events>
        ProxyPass http://127.0.0.1:56200/api/events flushpackets=on timeout=3600
        ProxyPassReverse http://127.0.0.1:56200/api/events
        SetEnv no-gzip 1
    </Location>

    ProxyPass        / http://127.0.0.1:56200/
    ProxyPassReverse / http://127.0.0.1:56200/

    RequestHeader set X-Forwarded-Proto "http"
</VirtualHost>
