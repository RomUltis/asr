# ===========================================================================
#  Orbit — exemple de reverse proxy Nginx
#  A placer dans /etc/nginx/sites-available/orbit puis :
#    sudo ln -s /etc/nginx/sites-available/orbit /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#  HTTPS : sudo certbot --nginx -d orbit.mondomaine.fr
# ===========================================================================

server {
    listen 80;
    server_name orbit.mondomaine.fr;

    client_max_body_size 1m;

    # Flux temps reel (SSE) : pas de mise en tampon, connexion longue
    location /api/events {
        proxy_pass http://127.0.0.1:56200;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:56200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
